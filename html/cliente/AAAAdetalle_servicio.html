<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Book&Cut - Detalle del Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/AAAAUnicoGlobal.css" />
    <link rel="stylesheet" href="/css/AAAADetalle_Servicios.css" />
</head>

<body>

    <header id="encabezado" class="bg-dark text-white">
        <div>
            <a href="/html/pantallaInicio.html">
                <img class="logo" src="/img/output-onlinepngtools.png" alt="logo" />
            </a>
        </div>
        <nav>
            <div>
                <a href="/html/pantallaInicio.html#Servicios" class="btn btn-outline-light activado nav-item"> Servicios
                </a>
                <a href="/html/pantallaInicio.html#Locales" class="btn btn-outline-light activado nav-item"> Locales
                </a>
            </div>
            <div id="zona-auth"></div>
        </nav>
    </header>

    <main class="contenedor-centrado">
        <div class="card-servicio">

            <div class="encabezado">
                <div>
                    <h2 id="servicio-titulo">Cargando...</h2>
                    <p class="duracion" id="servicio-duracion">Duración: --</p>
                </div>
                <span class="precio" id="servicio-precio">$ --.---</span>
            </div>

            <a href="/html/seleccion_barbero.html">
                <button class="btn-outline-dark activado btn-agendar">Agendar servicio</button>
            </a>

            <div class="icono">
                <img id="servicio-img" src="" alt="Icono del servicio">
            </div>

            <p class="descripcion" id="servicio-desc">
                Cargando información del servicio...
            </p>

        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/AAAAdetalle_servicio.js"></script>
</body>

</html>
